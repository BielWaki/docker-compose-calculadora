apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora
  labels:
    app: calculadora
spec:
  replicas: 4
  selector:
    matchLabels:
      app: calculadora
  template:
    metadata:
      labels:
        app: calculadora
    spec:
      containers:
      - name: calculadora
        image: calculadora-python:1.1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
